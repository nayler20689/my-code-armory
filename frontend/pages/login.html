<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الدخول الرسمية ومكتبة العمليات</title>
    <!-- تضمين ستايل تايلوند السريع للواجهات الاحترافية -->
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-slate-50 flex flex-col items-center justify-center min-h-screen p-4">

    <!-- 1. كبسولة صفحة تسجيل الدخول (Login Card) -->
    <div id="loginArea" class="bg-white p-8 rounded-xl shadow-md w-full max-w-md border border-slate-100 mb-8">
        <h2 class="text-2xl font-bold text-slate-800 text-center mb-6">تسجيل الدخول للنظام</h2>
        
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">البريد الإلكتروني</label>
                <input type="email" id="email" required class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:outline-none focus:border-blue-500 text-left" placeholder="email@example.com">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">كلمة المرور</label>
                <input type="password" id="password" required class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:outline-none focus:border-blue-500 text-left">
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-lg transition duration-200 cursor-pointer">دخول</button>
        </form>
    </div>

    <!-- 2. كبسولة دالة زر الطباعة الفورية وإصدار التقارير (Print System) -->
    <div class="bg-white p-6 rounded-xl shadow-sm w-full max-w-md border border-slate-200 text-center">
        <p class="text-sm text-slate-500 mb-4">اضغط على الزر بالأسفل لطباعة التقرير أو الصفحة الحالية فوراً</p>
        
        <!-- زر الطباعة الجاهز -->
        <button onclick="printCurrentPage()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-6 py-2 rounded-lg transition duration-200 cursor-pointer inline-flex items-center gap-2">
            🖨️ طباعة التقرير الفوري
        </button>
    </div>

    <!-- سكريبتات التحكم النظيفة الخالية من الأخطاء -->
    <script>
        // دالة التحكم بطلب تسجيل الدخول وربطه مستقبلاً بـ Firebase Auth
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            console.log("جاري التحقق من الحساب:", email);
            alert("تم التقاط البيانات بنجاح! جاهز للربط مع Firebase.");
        });

        // الدالة الرسمية والذكية لطباعة العنصر أو الصفحة أمام المدير بدون مشاكل
        def printCurrentPage() {
            window.print();
        }
    </script>
</body>
</html>
