<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مستودع الحقول البرمجية الجاهزة</title>
    <style>
        body {
            background: linear-gradient(135deg, #060911 0%, #111113 100%);
            color: #f1f5f9;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 16px;
            margin: 0;
            box-sizing: border-box;
        }
        .section-box {
            background-color: #16161a;
            border: 1px solid #7f1d1d;
            padding: 24px;
            border-radius: 16px;
            width: 100%;
            max-width: 550px;
            margin-bottom: 24px;
            box-shadow: 0 10px 30px rgba(127, 29, 29, 0.1);
        }
        .section-title {
            font-size: 16px;
            font-weight: 850;
            color: #f87171;
            border-bottom: 1px solid #3f3f46;
            padding-bottom: 8px;
            margin-bottom: 16px;
        }
        .field-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
        }
        label { font-size: 14px; font-weight: 600; color: #e5e5e5; }
        input, select, textarea {
            width: 100%;
            padding: 12px 14px;
            background-color: #212124;
            border: 1px solid #3f3f46;
            border-radius: 10px;
            color: #ffffff;
            font-size: 15px;
            box-sizing: border-box;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #ef4444;
        }
        .file-upload-box {
            background-color: rgba(33, 33, 36, 0.6);
            border: 2px dashed #4b5563;
            border-radius: 10px;
            padding: 16px;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- ==================== قطاع 1: البيانات الشخصية والأساسية ==================== -->
    <div class="section-box">
        <div class="section-title">👤 قطاع البيانات الشخصية والأساسية</div>

        <!-- كود حقل الاسم الثلاثي -->
        <div class="field-group">
            <label>الاسم الثلاثي والكنية</label>
            <input type="text" id="fullName" placeholder="اكتب الاسم الكامل">
        </div>

        <!-- كود حقل اسم الأب -->
        <div class="field-group">
            <label>اسم الأب</label>
            <input type="text" id="fatherName" placeholder="اسم الأب الكامل">
        </div>

        <!-- كود حقل اسم الأم -->
        <div class="field-group">
            <label>اسم الأم ونسبتها</label>
            <input type="text" id="motherName" placeholder="اسم الأم والكنية">
        </div>

        <!-- كود حقل مكان الولادة -->
        <div class="field-group">
            <label>مكان الولادة</label>
            <input type="text" id="birthPlace" placeholder="المحافظة / المدينة / البلدة">
        </div>

        <!-- كود حقل تاريخ الولادة -->
        <div class="field-group">
            <label>تاريخ الولادة</label>
            <input type="date" id="birthDate">
        </div>

        <!-- كود حقل الرقم الوطني / الهوية -->
        <div class="field-group">
            <label>الرقم الوطني / الهوية الشخصية</label>
            <input type="number" id="nationalId" style="text-align: right;" placeholder="000000000000">
        </div>

        <!-- كود حقل الحالة الاجتماعية -->
        <div class="field-group">
            <label>الحالة الاجتماعية</label>
            <select id="maritalStatus">
                <option value="">اختر الحالة...</option>
                <option value="عازب">عازب</option>
                <option value="متزوج">متزوج</option>
                <option value="أخرى">أخرى</option>
            </select>
        </div>
    </div>


    <!-- ==================== قطاع 2: المعطيات العسكرية والوظيفية ==================== -->
    <div class="section-box">
        <div class="section-title">🛡️ قطاع المعطيات العسكرية والوظيفية</div>

        <!-- كود حقل الرقم العسكري -->
        <div class="field-group">
            <label>الرقم العسكري</label>
            <input type="number" id="militaryId" style="text-align: right;" placeholder="00000000">
        </div>

        <!-- كود حقل الرتبة الحالية -->
        <div class="field-group">
            <label>الرتبة الحالية</label>
            <select id="militaryRank">
                <option value="">اختر الرتبة...</option>
                <option value="جندي">جندي</option>
                <option value="عريف">عريف</option>
                <option value="رقيب">رقيب</option>
                <option value="ملازم">ملازم</option>
                <option value="نقيب">نقيب</option>
            </select>
        </div>

        <!-- كود حقل الاختصاص الدقيق -->
        <div class="field-group">
            <label>الاختصاص العسكري الدقيق</label>
            <input type="text" id="specialization" placeholder="نوع الاختصاص">
        </div>
    </div>


    <!-- ==================== قطاع 3: السجل المالي والسكن والعتاد ==================== -->
    <div class="section-box">
        <div class="section-title">💼 قطاع السجل المالي والسكن والعتاد</div>

        <!-- كود حقل رقم الحساب المصرفي -->
        <div class="field-group">
            <label>رقم الحساب المصرفي (IBAN)</label>
            <input type="text" id="bankIban" placeholder="SY00 0000 0000 0000 0000 0000">
        </div>

        <!-- كود حقل مقاس اللباس العسكري -->
        <div class="field-group">
            <label>مقاس اللباس العسكري (الزي الرسمي)</label>
            <select id="clothingSize">
                <option value="">اختر المقاس...</option>
                <option value="S">S</option>
                <option value="M">M</option>
                <option value="L">L</option>
                <option value="XL">XL</option>
                <option value="XXL">XXL</option>
            </select>
        </div>

        <!-- كود حقل مكان السكن الحالي -->
        <div class="field-group">
            <label>مكان السكن الحالي بالتفصيل</label>
            <input type="text" id="livingPlace" placeholder="المحافظة - المنطقة - الشارع">
        </div>

        <!-- كود حقل رقم الهاتف الجوال -->
        <div class="field-group">
            <label>رقم الهاتف الجوال الأساسي</label>
            <input type="tel" id="phonePrimary" style="text-align: left; direction: ltr;" placeholder="09xxxxxxxx">
        </div>

        <!-- كود حقل زمرة الدم -->
        <div class="field-group">
            <label>زمرة الدم</label>
            <select id="bloodType">
                <option value="">اختر الفصيلة...</option>
                <option value="A+">A+</option>
                <option value="B+">B+</option>
                <option value="O+">O+</option>
                <option value="AB+">AB+</option>
            </select>
        </div>
    </div>


    <!-- ==================== قطاع 4: المرفقات والوثائق والصور ==================== -->
    <div class="section-box">
        <div class="section-title">📸 قطاع المرفقات والوثائق والصور</div>

        <!-- كود حقل رفع الصورة الشخصية الرسمية -->
        <div class="field-group">
            <label>الصورة الشخصية الرسمية</label>
            <div class="file-upload-box">
                <input type="file" id="personalPhoto" accept="image/*">
            </div>
        </div>

        <!-- كود حقل رفع صورة الهوية الشخصية -->
        <div class="field-group">
            <label>صورة وجه الهوية الشخصية</label>
            <div class="file-upload-box">
                
            </div>
        </div>
    </div>

</body>
</html>
